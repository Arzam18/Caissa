name: Build Caissa Android

on:
  workflow_dispatch:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r26d" >> $GITHUB_ENV

      - name: Build Caissa (ARM64 v8-A)
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-march=armv8-a"
          make -j$(nproc)
          cd ..
          mv build/bin/caissa caissa-v8a

      - name: Build Caissa (ARM64 DotProd - Cortex A76+)
        run: |
          rm -rf build
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-march=armv8.2-a+dotprod"
          make -j$(nproc)
          cd ..
          mv build/bin/caissa caissa-dotprod

      - name: Extract Exact UCI Engine Name
        run: |
          sudo apt-get update -y && sudo apt-get install -y qemu-user-static
          
          RAW_UCI_NAME=$(echo "uci" | qemu-aarch64-static ./caissa-v8a 2>/dev/null | grep "id name" | head -n 1 | cut -d' ' -f3-)
          
          if [ -z "$RAW_UCI_NAME" ]; then
            RAW_UCI_NAME="Caissa-dev-${GITHUB_SHA::7}"
          fi

          CLEAN_FILENAME=$(echo "$RAW_UCI_NAME" | tr ' ' '-')

          echo "UCI_NAME=${RAW_UCI_NAME}" >> $GITHUB_ENV
          echo "CLEAN_FILENAME=${CLEAN_FILENAME}" >> $GITHUB_ENV

          # Rename binaries using exact clean UCI string
          mv caissa-v8a ${CLEAN_FILENAME}-android-arm64-v8a
          mv caissa-dotprod ${CLEAN_FILENAME}-android-dotprod

      - name: List build output
        run: |
          ls -lh ${{ env.CLEAN_FILENAME }}-android-*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CLEAN_FILENAME }}-android-binaries
          path: ${{ env.CLEAN_FILENAME }}-android-*

      - name: Create prerelease
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.CLEAN_FILENAME }}-android
          name: ${{ env.UCI_NAME }} (Android)
          prerelease: true
          files: ${{ env.CLEAN_FILENAME }}-android-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
