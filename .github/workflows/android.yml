name: Android

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Caissa (ARM64 NEON)
        run: |
          NDK_CXX="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++"
          cd src
          make neon CC="$NDK_CXX" CXX="$NDK_CXX" LIBS="-static-libstdc++"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: caissa-android-binaries
          path: src/caissa-*-aarch64-neon
