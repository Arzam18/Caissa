name: Android ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK r27c
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "ndk;27.2.12479018"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$SDK_ROOT" ]]; then
            echo "::error::Android SDK root was not configured by setup-android."
            exit 1
          fi

          NDK="$SDK_ROOT/ndk/27.2.12479018"
          test -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          echo "ANDROID_NDK_PATH=$NDK" >> "$GITHUB_ENV"

      - name: Read engine version
        run: |
          set -euo pipefail

          VERSION="$(tr -d '\r\n' < version.txt)"
          if [[ -z "$VERSION" ]]; then
            echo "::error::version.txt is empty"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building Caissa $VERSION"

      - name: Build ARM64 NEON baseline
        run: |
          set -euo pipefail

          NDK_CXX="$ANDROID_NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          make -C src neon \
            CC="$NDK_CXX" \
            LIBS="-static-libstdc++" \

          cp "src/caissa-$VERSION-aarch64-neon" \
             "caissa-$VERSION-android-arm64-neon"

      - name: Build ARM64 DotProd (SDOT)
        run: |
          set -euo pipefail

          NDK_CXX="$ANDROID_NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          make -C src dotprod \
            CC="$NDK_CXX" \
            LIBS="-static-libstdc++" \

          cp "src/caissa-$VERSION-aarch64-dotprod" \
             "caissa-$VERSION-android-arm64-dotprod"

      - name: Verify Android binaries
        run: |
          set -euo pipefail

          NDK_BIN="$ANDROID_NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
          READELF="$NDK_BIN/llvm-readelf"
          OBJDUMP="$NDK_BIN/llvm-objdump"

          for binary in \
            "caissa-$VERSION-android-arm64-neon" \
            "caissa-$VERSION-android-arm64-dotprod"; do
            test -s "$binary"
            file "$binary"
            "$READELF" -h "$binary" | grep -q 'AArch64'
            if "$READELF" -d "$binary" | grep -q 'libc++_shared.so'; then
              echo "::error::$binary unexpectedly depends on libc++_shared.so"
              exit 1
            fi
            "$OBJDUMP" -d "$binary" > "$binary.disasm"
          done

          if ! grep -Eq '\b(add|ld1|smull|sqdmulh|smlal|umov|tbl|cnt|uaddlv)\s+v[0-9]+' \
            "caissa-$VERSION-android-arm64-neon.disasm"; then
            echo "::error::Baseline binary does not show expected ARM NEON instructions"
            exit 1
          fi

          if ! grep -Eq '\b(sdots?)\b' \
            "caissa-$VERSION-android-arm64-dotprod.disasm"; then
            echo "::error::DotProd binary contains no SDOT instruction"
            exit 1
          fi

          if grep -Eq '\b(sdots?)\b' \
            "caissa-$VERSION-android-arm64-neon.disasm"; then
            echo "::error::Baseline NEON binary unexpectedly contains SDOT"
            exit 1
          fi

          echo "Verified AArch64 binaries and separate NEON / DotProd instruction sets."
          rm -f *.disasm

      - name: Upload engine binaries
        uses: actions/upload-artifact@v4
        with:
          name: caissa-${{ env.VERSION }}-android-arm64
          path: |
            caissa-${{ env.VERSION }}-android-arm64-neon
            caissa-${{ env.VERSION }}-android-arm64-dotprod
          if-no-files-found: error
