name: Android

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:
    inputs:
      uci_date:
        description: "Engine UCI build date (YYYYMMDD)"
        required: true
        default: "20261109"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract engine version and UCI date
        env:
          INPUT_UCI_DATE: ${{ inputs.uci_date }}
        run: |
          VERSION=$(cat version.txt 2>/dev/null || echo "dev-${GITHUB_SHA::7}")
          UCI_DATE="${INPUT_UCI_DATE}"
          if [[ -z "${UCI_DATE}" ]]; then
            UCI_DATE="$(date -u +%Y%m%d)"
          fi
          if [[ ! "${UCI_DATE}" =~ ^[0-9]{8}$ ]]; then
            echo "Invalid uci_date '${UCI_DATE}'; expected YYYYMMDD." >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "UCI_DATE=${UCI_DATE}" >> "$GITHUB_ENV"

      - name: Patch Makefile for Clang / NDK
        run: |
          cd src
          # Remove GCC-specific LTO partition flag
          sed -i 's/-flto-partition=one//g' makefile
          # Enable exceptions required by backend/Memory.hpp
          sed -i 's/-fno-exceptions/-fexceptions/g' makefile

      - name: Build Caissa (ARM64 NEON)
        run: |
          NDK_CXX="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++"
          cd src
          make neon CC="$NDK_CXX" CXX="$NDK_CXX" LIBS="-static-libstdc++" UCI_DATE="$UCI_DATE"
          mv caissa-${{ env.VERSION }}-aarch64-neon caissa-${{ env.VERSION }}-android-arm64-neon

      - name: Build Caissa (ARM64 DotProd - Cortex A76+)
        run: |
          NDK_CXX="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++"
          cd src
          # Clean compiled objects from previous build
          rm -f backend/*.o frontend/*.o backend/syzygy/*.o
          # Swap architecture flag for DotProd support
          sed -i 's/-march=armv8-a+simd/-march=armv8.2-a+dotprod/g' makefile
          make neon CC="$NDK_CXX" CXX="$NDK_CXX" LIBS="-static-libstdc++" UCI_DATE="$UCI_DATE"
          mv caissa-${{ env.VERSION }}-aarch64-neon caissa-${{ env.VERSION }}-android-arm64-dotprod

      - name: Write build metadata
        run: |
          cat > caissa-android-build-metadata.txt <<EOF
          engine=Caissa
          engine_version=${VERSION}
          uci_date=${UCI_DATE}
          targets=arm64-neon,arm64-dotprod
          network=eval-ml-11a-100B-spsa-transplant.pnn
          ndk_compiler=Android NDK clang++
          EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: caissa-${{ env.VERSION }}-android-binaries
          path: |
            src/caissa-${{ env.VERSION }}-android-arm64-neon
            src/caissa-${{ env.VERSION }}-android-arm64-dotprod
            caissa-android-build-metadata.txt
